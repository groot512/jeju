<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>제주도 여행 경비 입출금 내역서</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Pretendard Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans min-h-screen pb-28">

  <!-- 상단 네비게이션 헤더 -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 py-3.5 shadow-xs">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-600 to-teal-400 flex items-center justify-center text-white shadow-md shadow-sky-600/20">
          <i data-lucide="receipt" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-base font-extrabold text-slate-900 tracking-tight">제주도 여행 경비 정산</h1>
            <span class="text-[10px] font-bold bg-sky-100 text-sky-800 px-1.5 py-0.5 rounded">최종안</span>
          </div>
          <p class="text-xs text-slate-500 font-medium">10.16 ~ 10.18 (참여 12명)</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <!-- 텍스트 복사 버튼 -->
        <button id="btn-copy-summary" class="p-2 rounded-xl text-slate-600 hover:bg-slate-100 transition-colors" title="정산 요약 복사">
          <i data-lucide="share-2" class="w-5 h-5"></i>
        </button>

        <!-- 관리자 토글 버튼 -->
        <button id="btn-admin-toggle" class="flex items-center gap-1 text-xs font-semibold px-2.5 py-2 rounded-xl border border-slate-200 text-slate-700 bg-slate-50 hover:bg-slate-100 transition-all">
          <i data-lucide="lock" class="w-3.5 h-3.5" id="admin-icon"></i>
          <span id="admin-btn-text">관리자</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 모바일 컨테이너 -->
  <main class="max-w-md mx-auto px-4 pt-3.5 space-y-3.5">

    <!-- 관리자 배너 -->
    <div id="admin-status-banner" class="hidden bg-amber-500 text-white px-3.5 py-2.5 rounded-2xl text-xs flex items-center justify-between shadow-sm animate-fade-in">
      <div class="flex items-center gap-2">
        <i data-lucide="shield-check" class="w-4 h-4"></i>
        <span class="font-bold">관리자 수정 모드 (비번: 4946)</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-reset-default" class="underline text-amber-100 hover:text-white text-[11px] font-semibold">최종안 복원</button>
        <button id="btn-admin-logout" class="bg-black/20 px-2 py-1 rounded-lg text-[11px] font-bold hover:bg-black/30">종료</button>
      </div>
    </div>

    <!-- 대시보드: 정산 및 최종 반환 하이라이트 카드 -->
    <div class="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 rounded-3xl p-5 text-white shadow-xl shadow-slate-900/15 relative overflow-hidden">
      <!-- 배경 장식 -->
      <div class="absolute -top-10 -right-10 w-36 h-36 bg-sky-500/10 rounded-full blur-2xl pointer-events-none"></div>

      <!-- 상단 잔액 & 인원 -->
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold text-slate-400 tracking-wide flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          최종 잔액 (수입 - 지출)
        </span>
        <div class="flex items-center gap-1 text-[11px] bg-white/10 px-2.5 py-1 rounded-full border border-white/10 text-slate-200">
          <span>반환 대상:</span>
          <span id="display-split-count" class="font-bold text-amber-300 font-mono">10명</span>
          <button id="btn-edit-split-count" class="hidden text-sky-300 underline ml-0.5" title="인원 수정">변경</button>
        </div>
      </div>

      <!-- 총 잔액 숫자 -->
      <div class="mb-4">
        <h2 id="total-balance" class="text-3xl font-black tracking-tight text-emerald-400 font-mono">712,000원</h2>
      </div>

      <!-- 핵심 하이라이트 박스: 1인당 잔금 반환액 -->
      <div class="bg-gradient-to-r from-purple-900/70 to-indigo-800/80 border border-purple-500/40 rounded-2xl p-3.5 mb-4 shadow-inner flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-purple-500/30 flex items-center justify-center text-purple-200">
            <i data-lucide="coins" class="w-5 h-5"></i>
          </div>
          <div>
            <div class="text-[11px] font-bold text-purple-200">잔금 반환 (나누기 10명)</div>
            <div class="text-[10px] text-purple-300/80">1인당 돌려받을 금액</div>
          </div>
        </div>
        <div class="text-right">
          <span id="per-person-refund" class="text-xl font-black text-white font-mono tracking-tight">71,200원</span>
        </div>
      </div>

      <!-- 수입 vs 지출 요약 그리드 -->
      <div class="grid grid-cols-2 gap-2.5 pt-3 border-t border-slate-700/70">
        <div class="bg-white/5 rounded-2xl p-3 border border-white/5">
          <div class="flex items-center gap-1.5 text-xs text-sky-400 mb-1 font-semibold">
            <i data-lucide="arrow-down-left" class="w-4 h-4"></i>
            <span>총 수입</span>
          </div>
          <p id="total-income" class="text-lg font-extrabold font-mono text-slate-100">3,700,000원</p>
        </div>
        <div class="bg-white/5 rounded-2xl p-3 border border-white/5">
          <div class="flex items-center gap-1.5 text-xs text-rose-400 mb-1 font-semibold">
            <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
            <span>총 지출</span>
          </div>
          <p id="total-expense" class="text-lg font-extrabold font-mono text-slate-100">2,988,000원</p>
        </div>
      </div>
    </div>

    <!-- 검색 및 필터 탭 -->
    <div class="space-y-2">
      <!-- 검색 필드 -->
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
        <input type="text" id="input-search" placeholder="항목명, 장소, 상세내용 검색..." 
               class="w-full pl-9 pr-9 py-2.5 bg-white rounded-2xl border border-slate-200/90 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 shadow-xs">
        <button id="btn-clear-search" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- 일정별 / 유형별 필터 칩 -->
      <div class="flex items-center gap-1.5 overflow-x-auto hide-scrollbar py-0.5" id="date-filter-chips">
        <button class="filter-chip active text-xs font-bold px-3.5 py-1.5 rounded-full bg-slate-900 text-white whitespace-nowrap shadow-xs" data-filter="all">전체 내역</button>
        <button class="filter-chip text-xs font-semibold px-3 py-1.5 rounded-full bg-white text-slate-600 border border-slate-200 whitespace-nowrap hover:bg-slate-50" data-filter="10.16">10.16 (1일차)</button>
        <button class="filter-chip text-xs font-semibold px-3 py-1.5 rounded-full bg-white text-slate-600 border border-slate-200 whitespace-nowrap hover:bg-slate-50" data-filter="10.17">10.17 (2일차)</button>
        <button class="filter-chip text-xs font-semibold px-3 py-1.5 rounded-full bg-white text-slate-600 border border-slate-200 whitespace-nowrap hover:bg-slate-50" data-filter="10.18">10.18 (3일차)</button>
        <button class="filter-chip text-xs font-semibold px-3 py-1.5 rounded-full bg-white text-slate-600 border border-slate-200 whitespace-nowrap hover:bg-slate-50" data-filter="기타">기타 / 지원</button>
        <button class="filter-chip text-xs font-semibold px-3 py-1.5 rounded-full bg-white text-emerald-700 border border-emerald-200 whitespace-nowrap hover:bg-emerald-50" data-filter="수입">수입만</button>
      </div>
    </div>

    <!-- 목록 섹션 헤더 -->
    <div class="flex items-center justify-between px-1">
      <span class="text-xs font-bold text-slate-700" id="item-count-label">입출금 상세 내역 (16건)</span>
      <span class="text-[11px] text-slate-400 font-medium" id="admin-help-hint">터치 시 세부 정보 확인</span>
    </div>

    <!-- 입출금 내역 목록 컨테이너 -->
    <div id="item-list" class="space-y-2">
      <!-- JavaScript로 실시간 렌더링 -->
    </div>

  </main>

  <!-- 관리자 모드 전용 플로팅 내역 추가 버튼 (FAB) -->
  <div id="fab-container" class="fixed bottom-6 right-6 z-30 hidden">
    <button id="btn-add-item" class="flex items-center gap-2 bg-slate-900 hover:bg-slate-800 active:scale-95 text-white font-bold text-xs px-4 py-3 rounded-full shadow-xl shadow-slate-900/30 transition-transform border border-slate-700">
      <i data-lucide="plus" class="w-4 h-4 text-emerald-400"></i>
      <span>항목 추가</span>
    </button>
  </div>

  <!-- 모달 1: 관리자 인증 (비밀번호: 4946) -->
  <div id="modal-admin-auth" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl w-full max-w-xs p-5 shadow-2xl space-y-4 animate-scale-up">
      <div class="text-center">
        <div class="w-12 h-12 bg-sky-50 text-sky-600 rounded-2xl flex items-center justify-center mx-auto mb-2.5">
          <i data-lucide="key-round" class="w-6 h-6"></i>
        </div>
        <h3 class="text-base font-bold text-slate-900">관리자 인증</h3>
        <p class="text-xs text-slate-500 mt-0.5">내역 수정 및 항목 관리를 위해<br>비밀번호를 입력해 주세요.</p>
      </div>

      <div>
        <input type="password" id="input-admin-pw" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="비밀번호 4자리" 
               class="w-full text-center tracking-widest text-lg font-bold py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500">
        <p id="auth-error-msg" class="text-xs text-rose-500 text-center mt-1.5 hidden font-semibold">비밀번호가 올바르지 않습니다.</p>
      </div>

      <div class="grid grid-cols-2 gap-2 pt-1">
        <button id="btn-cancel-auth" class="w-full py-2.5 rounded-xl border border-slate-200 text-slate-600 text-xs font-bold hover:bg-slate-50">취소</button>
        <button id="btn-confirm-auth" class="w-full py-2.5 rounded-xl bg-slate-900 text-white text-xs font-bold hover:bg-slate-800">확인</button>
      </div>
    </div>
  </div>

  <!-- 모달 2: 내역 수정 / 추가 모달 -->
  <div id="modal-item-form" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-white rounded-t-3xl sm:rounded-3xl w-full max-w-md p-5 shadow-2xl space-y-3.5 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <h3 id="form-modal-title" class="text-base font-bold text-slate-900">내역 수정</h3>
        <button id="btn-close-form" class="text-slate-400 hover:text-slate-600 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="item-editor-form" class="space-y-3">
        <input type="hidden" id="edit-item-id">

        <!-- 구분 선택 (수입 / 지출) -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">구분</label>
          <div class="grid grid-cols-2 gap-2">
            <label class="flex items-center justify-center gap-1.5 border rounded-xl py-2.5 cursor-pointer text-xs font-bold has-[:checked]:bg-sky-50 has-[:checked]:border-sky-500 has-[:checked]:text-sky-700">
              <input type="radio" name="item-type" value="income" class="sr-only">
              <i data-lucide="arrow-down-left" class="w-4 h-4 text-sky-600"></i> 수입
            </label>
            <label class="flex items-center justify-center gap-1.5 border rounded-xl py-2.5 cursor-pointer text-xs font-bold has-[:checked]:bg-rose-50 has-[:checked]:border-rose-500 has-[:checked]:text-rose-700">
              <input type="radio" name="item-type" value="expense" class="sr-only" checked>
              <i data-lucide="arrow-up-right" class="w-4 h-4 text-rose-600"></i> 지출
            </label>
          </div>
        </div>

        <!-- 일자 & 항목명 -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">일자</label>
            <input type="text" id="form-date" placeholder="예: 10.16" required
                   class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-sky-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">항목 / 내역</label>
            <input type="text" id="form-title" placeholder="예: 식대 (중식)" required
                   class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-sky-500 focus:outline-none">
          </div>
        </div>

        <!-- 상세 내용 (인원 등) -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">상세 내용 (인원 등)</label>
          <input type="text" id="form-detail" placeholder="예: 신옛촌주점" required
                 class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-sky-500 focus:outline-none">
        </div>

        <!-- 금액 -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">금액 (원)</label>
          <input type="number" id="form-amount" placeholder="0" required min="0" step="10"
                 class="w-full px-3 py-2 border border-slate-200 rounded-xl text-base font-bold font-mono focus:ring-2 focus:ring-sky-500 focus:outline-none">
        </div>

        <div class="pt-2 flex gap-2">
          <button type="button" id="btn-delete-item" class="hidden px-4 py-2.5 rounded-xl border border-rose-200 text-rose-600 hover:bg-rose-50 text-xs font-bold">
            삭제
          </button>
          <button type="submit" class="flex-1 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold shadow-md">
            저장하기
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 반환 인원 수정 모달 -->
  <div id="modal-split-count" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl w-full max-w-xs p-5 shadow-2xl space-y-3">
      <h3 class="text-sm font-bold text-slate-900 text-center">반환 대상 인원수 변경</h3>
      <input type="number" id="input-split-num" min="1" max="50" class="w-full text-center text-lg font-bold py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-500">
      <div class="grid grid-cols-2 gap-2 pt-1">
        <button id="btn-cancel-split" class="py-2 border border-slate-200 text-slate-600 text-xs font-semibold rounded-xl">취소</button>
        <button id="btn-save-split" class="py-2 bg-slate-900 text-white text-xs font-bold rounded-xl">적용</button>
      </div>
    </div>
  </div>

  <!-- 토스트 알림 메시지 바 -->
  <div id="toast" class="fixed top-14 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 backdrop-blur-xs text-white text-xs font-medium px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300">
    알림 내용
  </div>

  <script>
    // ------------------------------------------------------------------
    // 최종 수정안 이미지 기반 정확한 기본 데이터 세팅
    // ------------------------------------------------------------------
    const FINAL_DEFAULT_DATA = [
      // 수입 내역 (2건)
      { id: 'inc-1', type: 'income', date: '10.16', title: '여행 회비', detail: '1인당 300,000원 × 12명', amount: 3600000 },
      { id: 'inc-2', type: 'income', date: '10.16', title: '찬조금', detail: '탁태구 친구 찬조', amount: 100000 },

      // 지출 내역 (14건)
      { id: 'exp-1', type: 'expense', date: '10.16', title: '식대 (중식)', detail: '신옛촌주점', amount: 270000 },
      { id: 'exp-2', type: 'expense', date: '10.16', title: '식대 (석식)', detail: '코시롱 흑돼지 (할인 30,000원 받음)', amount: 364700 },
      { id: 'exp-3', type: 'expense', date: '10.17', title: '식대 (중식)', detail: '등대와 풍차 (전복 등)', amount: 213000 },
      { id: 'exp-4', type: 'expense', date: '10.17', title: '식대 (석식)', detail: '등대와 바랑', amount: 510000 },
      { id: 'exp-5', type: 'expense', date: '10.16', title: '관광 / 입장료', detail: '라온랜드 / 더마파크 등 입장료', amount: 50000 },
      { id: 'exp-6', type: 'expense', date: '10.16', title: '간식', detail: '팝콘', amount: 12000 },
      { id: 'exp-7', type: 'expense', date: '10.16~18', title: '차량 렌트', detail: '렌트카 비용 (전 일정)', amount: 800000 },
      { id: 'exp-8', type: 'expense', date: '10.17', title: '관광 / 공원', detail: '더파크 공원 (13명)', amount: 221000 },
      { id: 'exp-9', type: 'expense', date: '10.17', title: '기사 팁', detail: '운전기사분 팁', amount: 100000 },
      { id: 'exp-10', type: 'expense', date: '10.18', title: '교통비', detail: '택시비', amount: 48300 },
      { id: 'exp-11', type: 'expense', date: '기타', title: '교통 / 지원', detail: '포항 김해정', amount: 80000 },
      { id: 'exp-12', type: 'expense', date: '기타', title: '교통 / 지원', detail: '부산 유순화', amount: 80000 },
      { id: 'exp-13', type: 'expense', date: '기타', title: '교통 / 지원', detail: '길안, 청송 (3명) 차비', amount: 100000 },
      { id: 'exp-14', type: 'expense', date: '기타', title: '공항 식대', detail: '대구공항 식대', amount: 139000 },
    ];

    const STORAGE_ITEMS_KEY = 'jeju_settlement_v2_final_items';
    const STORAGE_SPLIT_KEY = 'jeju_settlement_v2_split_count';
    const ADMIN_PASSWORD = '4946';

    let items = [];
    let splitCount = 10; // 나누기 10명 기준
    let isAdmin = false;
    let currentFilter = 'all';
    let searchQuery = '';

    // ------------------------------------------------------------------
    // 헬퍼 함수
    // ------------------------------------------------------------------
    function formatMoney(num) {
      return (Number(num) || 0).toLocaleString('ko-KR') + '원';
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2000);
    }

    // ------------------------------------------------------------------
    // 저장소 로드 / 저장
    // ------------------------------------------------------------------
    function loadData() {
      const savedItems = localStorage.getItem(STORAGE_ITEMS_KEY);
      if (savedItems) {
        try {
          items = JSON.parse(savedItems);
        } catch (e) {
          items = JSON.parse(JSON.stringify(FINAL_DEFAULT_DATA));
        }
      } else {
        items = JSON.parse(JSON.stringify(FINAL_DEFAULT_DATA));
      }

      const savedSplit = localStorage.getItem(STORAGE_SPLIT_KEY);
      if (savedSplit) {
        splitCount = parseInt(savedSplit, 10) || 10;
      } else {
        splitCount = 10;
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_ITEMS_KEY, JSON.stringify(items));
      localStorage.setItem(STORAGE_SPLIT_KEY, splitCount.toString());
    }

    // ------------------------------------------------------------------
    // 화면 렌더링
    // ------------------------------------------------------------------
    function render() {
      // 1. 합계 계산
      let totalIncome = 0;
      let totalExpense = 0;

      items.forEach(it => {
        const val = Number(it.amount) || 0;
        if (it.type === 'income') totalIncome += val;
        else totalExpense += val;
      });

      const totalBalance = totalIncome - totalExpense;
      const refundPerPerson = splitCount > 0 ? Math.round(totalBalance / splitCount) : 0;

      // 2. 대시보드 UI 반영
      document.getElementById('total-income').textContent = formatMoney(totalIncome);
      document.getElementById('total-expense').textContent = formatMoney(totalExpense);
      document.getElementById('total-balance').textContent = formatMoney(totalBalance);
      document.getElementById('per-person-refund').textContent = formatMoney(refundPerPerson);
      document.getElementById('display-split-count').textContent = `${splitCount}명`;

      // 3. 필터링 및 검색
      const filtered = items.filter(it => {
        // 날짜/유형 필터
        if (currentFilter === '수입' && it.type !== 'income') return false;
        if (currentFilter === '10.16' && !it.date.includes('10.16')) return false;
        if (currentFilter === '10.17' && !it.date.includes('10.17')) return false;
        if (currentFilter === '10.18' && !it.date.includes('10.18')) return false;
        if (currentFilter === '기타' && it.date !== '기타') return false;

        // 검색어
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const target = `${it.title} ${it.detail} ${it.date}`.toLowerCase();
          return target.includes(q);
        }
        return true;
      });

      // 4. 목록 렌더링
      const listEl = document.getElementById('item-list');
      document.getElementById('item-count-label').textContent = `입출금 상세 내역 (${filtered.length}건)`;

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="text-center py-12 bg-white rounded-2xl border border-dashed border-slate-200">
            <i data-lucide="receipt" class="w-8 h-8 text-slate-300 mx-auto mb-1.5"></i>
            <p class="text-xs text-slate-400 font-medium">일치하는 내역이 없습니다.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      let html = '';
      filtered.forEach(it => {
        const isInc = it.type === 'income';
        const badgeBg = isInc ? 'bg-sky-50 text-sky-700 border-sky-200' : 'bg-slate-100 text-slate-600 border-slate-200';
        const amountColor = isInc ? 'text-sky-600' : 'text-slate-900';
        const sign = isInc ? '+' : '-';
        const iconName = isInc ? 'arrow-down-left' : 'arrow-up-right';

        html += `
          <div class="bg-white rounded-2xl p-3.5 border border-slate-200/80 shadow-xs flex items-center justify-between gap-3 transition-all ${isAdmin ? 'cursor-pointer hover:border-amber-400 hover:bg-amber-50/20 active:scale-[0.99]' : ''}"
               ${isAdmin ? `onclick="openEditModal('${it.id}')"` : ''}>
            <div class="flex items-start gap-3 min-w-0 flex-1">
              <div class="w-10 h-10 rounded-xl ${isInc ? 'bg-sky-50 text-sky-600' : 'bg-rose-50 text-rose-500'} flex-shrink-0 flex items-center justify-center font-bold text-xs flex-col leading-none">
                <i data-lucide="${iconName}" class="w-4 h-4 mb-0.5"></i>
                <span class="text-[10px]">${isInc ? '수입' : '지출'}</span>
              </div>
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-1.5 mb-0.5">
                  <span class="text-[10px] font-bold px-1.5 py-0.5 rounded border ${badgeBg}">${it.date}</span>
                  <h4 class="text-sm font-bold text-slate-900 truncate">${it.title}</h4>
                </div>
                <p class="text-xs text-slate-500 truncate">${it.detail}</p>
              </div>
            </div>

            <div class="text-right flex-shrink-0 flex items-center gap-1.5">
              <span class="text-sm font-black font-mono tracking-tight ${amountColor}">
                ${sign}${formatMoney(it.amount)}
              </span>
              ${isAdmin ? `<i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>` : ''}
            </div>
          </div>
        `;
      });

      listEl.innerHTML = html;
      lucide.createIcons();
    }

    // ------------------------------------------------------------------
    // 관리자 모드 상태 전환
    // ------------------------------------------------------------------
    function updateAdminUI() {
      const banner = document.getElementById('admin-status-banner');
      const fab = document.getElementById('fab-container');
      const adminIcon = document.getElementById('admin-icon');
      const adminBtnText = document.getElementById('admin-btn-text');
      const btnToggle = document.getElementById('btn-admin-toggle');
      const btnEditSplit = document.getElementById('btn-edit-split-count');
      const helpHint = document.getElementById('admin-help-hint');

      if (isAdmin) {
        banner.classList.remove('hidden');
        fab.classList.remove('hidden');
        btnEditSplit.classList.remove('hidden');
        adminIcon.setAttribute('data-lucide', 'unlock');
        adminBtnText.textContent = '관리중';
        btnToggle.classList.add('bg-amber-100', 'border-amber-300', 'text-amber-800');
        helpHint.textContent = '항목 터치 시 수정/삭제 가능';
        helpHint.className = 'text-[11px] text-amber-600 font-bold';
      } else {
        banner.classList.add('hidden');
        fab.classList.add('hidden');
        btnEditSplit.classList.add('hidden');
        adminIcon.setAttribute('data-lucide', 'lock');
        adminBtnText.textContent = '관리자';
        btnToggle.classList.remove('bg-amber-100', 'border-amber-300', 'text-amber-800');
        helpHint.textContent = '터치 시 세부 정보 확인';
        helpHint.className = 'text-[11px] text-slate-400 font-medium';
      }
      lucide.createIcons();
      render();
    }

    // ------------------------------------------------------------------
    // 모달 동작
    // ------------------------------------------------------------------
    window.openEditModal = function(id) {
      if (!isAdmin) return;
      const it = items.find(i => i.id === id);
      if (!it) return;

      document.getElementById('form-modal-title').textContent = '내역 수정';
      document.getElementById('edit-item-id').value = it.id;
      document.querySelector(`input[name="item-type"][value="${it.type}"]`).checked = true;
      document.getElementById('form-date').value = it.date;
      document.getElementById('form-title').value = it.title;
      document.getElementById('form-detail').value = it.detail;
      document.getElementById('form-amount').value = it.amount;

      document.getElementById('btn-delete-item').classList.remove('hidden');
      document.getElementById('modal-item-form').classList.remove('hidden');
    };

    function openAddModal() {
      document.getElementById('form-modal-title').textContent = '새 항목 추가';
      document.getElementById('edit-item-id').value = '';
      document.getElementById('item-editor-form').reset();
      document.getElementById('form-date').value = '10.17';
      document.querySelector(`input[name="item-type"][value="expense"]`).checked = true;
      document.getElementById('btn-delete-item').classList.add('hidden');
      document.getElementById('modal-item-form').classList.remove('hidden');
    }

    function closeFormModal() {
      document.getElementById('modal-item-form').classList.add('hidden');
    }

    // ------------------------------------------------------------------
    // 이벤트 바인딩
    // ------------------------------------------------------------------
    document.addEventListener('DOMContentLoaded', () => {
      loadData();
      render();

      // 관리자 버튼
      document.getElementById('btn-admin-toggle').addEventListener('click', () => {
        if (isAdmin) {
          isAdmin = false;
          updateAdminUI();
          showToast('관리자 모드가 종료되었습니다.');
        } else {
          document.getElementById('input-admin-pw').value = '';
          document.getElementById('auth-error-msg').classList.add('hidden');
          document.getElementById('modal-admin-auth').classList.remove('hidden');
          setTimeout(() => document.getElementById('input-admin-pw').focus(), 100);
        }
      });

      // 비밀번호 인증
      document.getElementById('btn-confirm-auth').addEventListener('click', () => {
        const val = document.getElementById('input-admin-pw').value.trim();
        if (val === ADMIN_PASSWORD) {
          isAdmin = true;
          document.getElementById('modal-admin-auth').classList.add('hidden');
          updateAdminUI();
          showToast('관리자로 인증되었습니다. (항목을 눌러 수정)');
        } else {
          document.getElementById('auth-error-msg').classList.remove('hidden');
        }
      });

      document.getElementById('input-admin-pw').addEventListener('keyup', (e) => {
        if (e.key === 'Enter') document.getElementById('btn-confirm-auth').click();
      });

      document.getElementById('btn-cancel-auth').addEventListener('click', () => {
        document.getElementById('modal-admin-auth').classList.add('hidden');
      });

      document.getElementById('btn-admin-logout').addEventListener('click', () => {
        isAdmin = false;
        updateAdminUI();
        showToast('관리자 모드가 종료되었습니다.');
      });

      // 최종안 기본값으로 복원
      document.getElementById('btn-reset-default').addEventListener('click', () => {
        items = JSON.parse(JSON.stringify(FINAL_DEFAULT_DATA));
        splitCount = 10;
        saveData();
        render();
        showToast('최종 수정안 원본 데이터로 복원되었습니다.');
      });

      // 추가 / 수정 모달
      document.getElementById('btn-add-item').addEventListener('click', openAddModal);
      document.getElementById('btn-close-form').addEventListener('click', closeFormModal);

      // 폼 제출
      document.getElementById('item-editor-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const editId = document.getElementById('edit-item-id').value;
        const type = document.querySelector('input[name="item-type"]:checked').value;
        const date = document.getElementById('form-date').value.trim();
        const title = document.getElementById('form-title').value.trim();
        const detail = document.getElementById('form-detail').value.trim();
        const amount = parseInt(document.getElementById('form-amount').value, 10) || 0;

        if (editId) {
          const idx = items.findIndex(i => i.id === editId);
          if (idx !== -1) {
            items[idx] = { ...items[idx], type, date, title, detail, amount };
            showToast('수정되었습니다.');
          }
        } else {
          items.push({
            id: 'it-' + Date.now(),
            type,
            date,
            title,
            detail,
            amount
          });
          showToast('새 내역이 추가되었습니다.');
        }

        saveData();
        closeFormModal();
        render();
      });

      // 항목 삭제
      document.getElementById('btn-delete-item').addEventListener('click', () => {
        const editId = document.getElementById('edit-item-id').value;
        if (!editId) return;
        items = items.filter(i => i.id !== editId);
        saveData();
        closeFormModal();
        render();
        showToast('내역이 삭제되었습니다.');
      });

      // 반환 인원수 수정
      document.getElementById('btn-edit-split-count').addEventListener('click', () => {
        document.getElementById('input-split-num').value = splitCount;
        document.getElementById('modal-split-count').classList.remove('hidden');
      });
      document.getElementById('btn-cancel-split').addEventListener('click', () => {
        document.getElementById('modal-split-count').classList.add('hidden');
      });
      document.getElementById('btn-save-split').addEventListener('click', () => {
        const val = parseInt(document.getElementById('input-split-num').value, 10);
        if (val && val > 0) {
          splitCount = val;
          saveData();
          render();
          document.getElementById('modal-split-count').classList.add('hidden');
          showToast(`반환 대상이 ${val}명으로 변경되었습니다.`);
        }
      });

      // 요약 복사 기능
      document.getElementById('btn-copy-summary').addEventListener('click', () => {
        let totalIncome = 0;
        let totalExpense = 0;
        items.forEach(it => {
          if (it.type === 'income') totalIncome += it.amount;
          else totalExpense += it.amount;
        });
        const balance = totalIncome - totalExpense;
        const refund = splitCount > 0 ? Math.round(balance / splitCount) : 0;

        const summaryText = `[제주도 여행 경비 최종 정산 (10.16~18)]\n` +
          `• 총 수입: ${formatMoney(totalIncome)}\n` +
          `• 총 지출: ${formatMoney(totalExpense)}\n` +
          `• 최종 잔액: ${formatMoney(balance)}\n` +
          `• 잔금 반환 (${splitCount}명 기준 1인당): ${formatMoney(refund)}\n\n` +
          `* 상세 내역은 정산기 앱에서 확인 가능합니다.`;

        const tempInput = document.createElement('textarea');
        tempInput.value = summaryText;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);

        showToast('정산 요약 텍스트가 클립보드에 복사되었습니다.');
      });

      // 필터 탭 클릭
      document.querySelectorAll('.filter-chip').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.filter-chip').forEach(b => {
            b.classList.remove('bg-slate-900', 'text-white', 'shadow-xs', 'active');
            b.classList.add('bg-white', 'text-slate-600', 'border', 'border-slate-200');
          });
          this.classList.remove('bg-white', 'text-slate-600', 'border', 'border-slate-200');
          this.classList.add('bg-slate-900', 'text-white', 'shadow-xs', 'active');

          currentFilter = this.getAttribute('data-filter');
          render();
        });
      });

      // 검색 인풋
      const searchInput = document.getElementById('input-search');
      const clearSearchBtn = document.getElementById('btn-clear-search');
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        if (searchQuery) clearSearchBtn.classList.remove('hidden');
        else clearSearchBtn.classList.add('hidden');
        render();
      });

      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        searchQuery = '';
        clearSearchBtn.classList.add('hidden');
        render();
      });
    });
  </script>
</body>
</html>
